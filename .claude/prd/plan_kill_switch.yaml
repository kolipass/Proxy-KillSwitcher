        files_to_create:
            -   path: >
                    core/common/src/test/java/OrbitTestExt.kt
                description: runActionAndCheckResultState helper used by ViewModel tests.
            -   path: >
                    feature/killswitch/src/test/java/KillSwitchPrefsTest.kt
                description: Persist and read host, port, isEnabled.
            -   path: >
                    feature/killswitch/src/test/java/ToggleKillSwitchUseCaseTest.kt
                description: sut, When Then names, availability gate, no VpnService mock.
            -   path: >
