pipeline: Implementation Plan Final Quality Tasks

status: accepted

summary:
  problem: "План заканчивался кодовой таской: стиль расходился с правилами скиллов, ревью тонуло
    в стилевых правках, а красный verify останавливал пайплайн и ждал человека."
  solution: "Каждый план обязан завершаться одной таской — указателем на process-stylist, который
    аудирует дифф, чинит процитированное и один раз гоняет валидаторы; закреплено IP17/IP21."
  tradeoff: "Фиксированный оверхед одной таски в каждом плане и риск over-correction слабой
    модели — смягчён запретом правок без цитаты конкретного rule id, но не устранён."

context: >
  План пишет planner-агент по PRD; исполняет слабая модель (Kimi). Kimi обнаруживает
  .skills относительно рабочей директории и умеет саб-агентов, но чтение SKILL.md остаётся
  решением модели — гарантии, что указатель будет открыт, нет. План заканчивался последней кодовой
  таской: написанный код расходился с правилами скиллов, и ревью съедало время на стилевые
  замечания. Пины IP12 проблему не закрывают: они выбираются на этапе планирования, до написания
  кода, поэтому неполны — реально нужные правила выясняются только по факту реализации. Блок
  verify детерминирован, но сам не чинит: красный ktlint/detekt останавливает пайплайн и ждёт
  человека, против цели экономии времени ревью. Полный свод правил — 54 SKILL.md — в контекст
  слабой модели не помещается, а загрузка десятков файлов правил ухудшает качество генерации;
  при этом часть доменов (author, docs, scout, planner, gitnexus) к написанию кода не относится.
  Реестр author/category_registry/SKILL.md уже перечисляет все домены с префиксами правил —
  естественное место для списка кодовых доменов. Таски плана могут коммититься по одной, поэтому
  область проверки — diff всей ветки, а не только рабочего дерева.

decision: >
  Каждый план завершается одной обязательной таской, которую planner генерирует по шаблону IP17
  после прохода pin_skills. Её текст — указатель на .skills/process-stylist/SKILL.md плюс
  одна строка-конспект: область проверки это полный diff ветки,
  git diff --name-only $(git merge-base main HEAD)..HEAD плюс незакоммиченные изменения, и
  меняется только процитированное нарушение. Сама процедура в план не копируется и живёт в скилле:
  отбор доменов из scopes.code с проверкой, что SKILL.md домена есть в проекте и несёт
  нумерованные правила; read-only аудит по одному домену параллельными саб-агентами; механическая
  проверка находок против SKILL.md и диффа; фиксы; один прогон валидаторов стека после того, как
  устранены все находки. Лимит в две попытки починки переехал туда же. Блок verify остаётся
  единственным детерминированным гейтом: пайплайн запускает его сам, без LLM и токенов, а запрет
  per-task verify закреплён в IP21. Закрепление: правила IP17 (таска-указатель) и IP21
  (единственный verify) в docs/plan (id_range IP01-IP21), структурные проверки в validate_plan.py,
  шаг генерации финальной таски в planner/SKILL.md, список scopes.code в category_registry.
  n8n/full_automation не меняется: таска исполняется штатным циклом, verify — штатной нодой.

consequences:
  positive:
    review_time_drop: >
      Код приходит на ревью уже приведённым к правилам скиллов и с зелёными валидаторами —
      стилевые замечания сняты до человека.
    machine_guarantee: >
      Наличие и форма финальной таски проверяются validate_plan.py — «всегда» держится
      валидатором, а не памятью planner-агента.
    weak_model_scoped: >
      Аудит идёт по одному домену за раз только по изменённым файлам — контекст слабой модели
      не переполняется полным сводом правил.
    self_healing_finish: >
      Красные валидаторы чинятся последним шагом скилла ещё до verify — пайплайн доезжает до
      зелёного без ожидания человека.
  negative:
    fixed_overhead: >
      Одна обязательная таска добавляется в каждый план, включая тривиальные планы из одной-двух
      тасок — оверхед не отключается.
    over_correction_risk: >
      Слабая модель может «починить» корректный код; constraints снижают риск, но семантический
      дрейф вне тестового покрытия проходит гейт.
    pointer_needs_opening: >
      Указатель раскрывается, только если исполнитель откроет SKILL.md — скилл виден ему в
      промпте, но чтение остаётся решением модели; страховка — строка-конспект в таске.

rules:
  final_pointer_task: >
    Каждый план завершается ровно одной таской-указателем на скилл — ни одна кодовая таска не
    располагается после неё.
  pointer_plus_summary: >
    Текст финальной таски — указатель на .skills/process-stylist/SKILL.md плюс одна
    строка-конспект; полная процедура в план не копируется никогда.
  scope_list_registry: >
    Кандидатный список кодовых доменов задаётся scopes.code в author/category_registry/SKILL.md;
    новый кодовый домен добавляется туда, meta-домены не перечисляются.
  fix_only_cited: >
    Проход меняет код только при цитируемом нарушении конкретного rule id; поведение и API не
    меняются, рефакторинг вне нарушений запрещён.
  validators_run_once: >
    Валидаторы стека запускаются один раз, после того как устранены находки всех доменов —
    никогда после отдельной правки или отдельного домена.
  verify_stays_gate: >
    Verify остаётся единственным финальным блоком плана (IP21) — детерминированная перепроверка
    вне LLM, которую пайплайн запускает сам.

components:
  standard: .skills/docs/plan/SKILL.md — правила IP17 (таска-указатель) и IP21 (verify)
  skill: .skills/process-stylist/SKILL.md — сама процедура - аудит, проверка, фиксы, валидаторы
  validator: .skills/docs/tools/validate_plan.py — проверка наличия и формы финальной таски
  tests: .skills/docs/tools/test_plan_standard.py — фикстуры и тесты новых правил
  process_planner: .skills/process-planner/SKILL.md — шаг генерации финальной таски после pin_skills
  registry: .skills/author/category_registry/SKILL.md — список scopes.code кодовых доменов

rejected_alternatives:
  union_pinned_rules: >
    Область compliance как объединение IP12-пинов всех тасок — пины выбираются до написания
    кода и неполны; нужные правила проявляются только после реализации.
  all_skills_audit: >
    Проход по всем 54 SKILL.md подряд — длинная сессия слабой модели деградирует к концу
    списка, а meta-домены к коду не относятся; кодовые домены отбирает список scopes.code.
  verify_only_validators: >
    Валидаторы только в verify без fix-loop-таски — verify находит, но не чинит: красный
    прогон останавливает пайплайн и ждёт человека, что противоречит цели.
  pipeline_review_node: >
    Compliance-проход в ревью-ноде full_automation — работает только внутри этого пайплайна;
    План исполняется и вручную, инвариант должен жить в самом плане.
  two_verbatim_tasks: >
    Оставить две самодостаточные таски с полным текстом процедуры — обоснованием была неспособность
    Kimi подгружать скиллы, которая не подтвердилась; цена — процедура в четырёх копиях сразу.

history:
  v1: Принято - каждый план завершают compliance-таска и validators fix-loop; IP21/IP22, scope в registry
  v2: >
    Перенумерация при реализации: старое IP17 (формат verify) удалено, compliance стал IP17,
    validators — IP21 (вобрало запрет per-task verify); id_range IP01-IP21.
  v3: Перенумерация под docs/plan - compliance и validators — IP17 и IP21; id_range IP01-IP21
  v4: >
    Две финальные таски схлопнуты в одну таску-указатель на process-stylist; посылка про
    автозагрузку скиллов у Kimi опровергнута; валидаторы запускаются один раз в конце.
