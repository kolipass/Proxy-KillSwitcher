pipeline: Two-Layer PRD Standard

status: accepted

summary:
  problem: "prd.yaml v3 не устраивал никого: человек тонул в пересказах решения, агенту не хватало деталей о механике."
  solution: "Один YAML с двумя слоями: summary из трёх строк для человека, детальные секции — для агента."
  tradeoff: "Анти-дублирование и полнота секций держатся на дисциплине автора, а не на автоматике."

context: >
  PRD пишется агентом по итогам обсуждения и читается двумя аудиториями: агентом-планировщиком —
  чтобы войти в задачу без исходного разговора, и человеком — на ревью. Предыдущая версия
  стандарта проваливала обе цели разом. Дублирование: один и тот же вывод пересказывался в
  нескольких секциях подряд — человек читал одно и то же по три раза. Лимиты на длину были
  туже, чем реальная механика бага, поэтому PRD молча их нарушали, лишь бы не резать смысл.
  Секции, которых не хватало на практике — расхождения реализации с решением, находки
  верификации — агенты придумывали сами, вне стандарта, кто во что горазд. Негативные
  последствия решения не фиксировались вовсе — в PRD попадали только плюсы.

decision: >
  Один YAML-файл с двумя слоями вместо пересказа в несколько секций. Человеческий слой —
  обязательный summary ровно из трёх quoted-значений problem/solution/tradeoff, до 300
  символов, с переносом строк допустимым, но без блоков: читатель либо останавливается на
  нём, либо идёт глубже. Агентный слой — context и decision на полную механику и
  обоснование. Список необязательных секций расширен и официально описан стандартом —
  расхождения реализации и находки проверки получили штатное место вместо самодеятельности.
  Каждое решение фиксирует и плюсы, и цену, которую за него платят. Стиль скаляров унифицирован:
  многострочное значение — только явный блок, короткое — голым текстом в одну строку без
  кавычек; кавычки остаются только внутри summary. Ссылки на номер правила или задачи из
  содержимого убраны — номера меняются, а описание сути остаётся верным всегда. Каждый факт
  живёт ровно в одной секции.

consequences:
  positive:
    human_entry_point: >
      Человек получает вход за три строки summary вместо чтения всего файла; глубже — только
      по необходимости.
    room_for_real_mechanics: >
      Лимит на context/decision вмещает реальную механику багов — стандарт больше не
      заставляет резать содержание, ради которого агент читает PRD.
    honest_tradeoffs: >
      Обязательные негативные последствия фиксируют цену решения — раньше в PRD попадали
      только плюсы.
    verification_home: >
      Расхождения реализации и находки верификации получили штатное место вместо
      распухшего history или самодеятельных секций вне стандарта.
  negative:
    legacy_text_rewritten: >
      Миграция на новый стандарт переписала формулировки старых PRD — дословный
      исходный текст остаётся только в git history, не в живом дереве репозитория.
    discipline_required: >
      Слоистость и анти-дублирование машиной не проверяются — качество среза для человека
      держится на дисциплине автора PRD.

rules:
  summary_first_stop: >
    summary пишется так, чтобы человек мог остановиться на нём: без ссылок на секции ниже и
    без оборванной мысли.
  checks_need_tests: >
    Правило, которое не покрыто тестом валидатора, — это ещё не правило, а пожелание;
    обе части меняются одним изменением.
  sections_via_standard: >
    Новая секция сначала добавляется в сам стандарт, валидатор и тесты — не изобретается
    в отдельном PRD явочным порядком.
  documented_cap_has_buffer: >
    Число в правиле — цель, к которой пишет автор, а не порог, в который целятся впритык.
    Валидатор отдельно следит за фактическим соответствием; автор не подглядывает в его
    внутренний предел. Порог живёт константой в коде, не в тексте правила.
  measure_dont_guess: >
    Обрезка при превышении лимита символов считается из чисел сообщения — факт минус
    предел, — а не на глаз; так один заход правки закрывает превышение, а не серия
    обрезков наугад.
  self_documenting_code: >
    Валидатор и тесты обходятся без комментариев — имена функций и переменных сами
    объясняют, что происходит; когда одного имени не хватает, код разбивается на более
    мелкие именованные шаги вместо пояснительной прозы.

flow:
  - обсуждение проблемы с пользователем идёт до согласия на подход, раньше текста PRD не пишется
  - агент оформляет согласованный подход одним PRD-файлом — human-слой и agent-слой разом
  - валидатор проверяет структуру, стиль скаляров и лимиты до того, как PRD считается готовым
  - принятый PRD передаётся дальше — планировщику для Implementation Plan

components:
  skill: .cursor/skills/docs/prd/SKILL.md — свод правил стандарта
  validator: .cursor/skills/docs/tools/validate_prd.py — структура, стиль скаляров, лимиты
  tests: .cursor/skills/docs/tools/test_prd_standard.py — фикстурный тест на каждое правило

paths:
  - PRD-файл лежит в .claude/prd/<slug>/<три_слова>_prd.yaml целевого репозитория
  - имя файла — ровно три snake_case слова перед расширением, без исключений

setup:
  - PyYAML установлен и доступен локально для запуска валидатора
  - свод правил стандарта прочитан перед тем, как писать или менять PRD

implementation_deltas:
  bare_scalar_added_later: >
    Изначально короткое значение вне summary разрешалось и в кавычках, и голым текстом;
    после того как агент раз за разом ловил случайный перенос кавычки на вторую строку,
    форму сузили до одного варианта — голого текста или явного блока.

discovered_issues:
  unenforced_rule_found:
    status: resolved
    problem: >
      Одно из правил стандарта описывало пустую строку между верхнеуровневыми секциями,
      но валидатор её не проверял — расхождение вскрылось только при построчном разборе
      самого файла стандарта.
    fix: >
      Правило оставлено как задокументированная договорённость без автоматической
      проверки — реальных нарушений на практике оно не порождало.

rejected_alternatives:
  two_documents: >
    Отдельный краткий документ для человека рядом с детальным для агента — разъезжается после
    первой же итерации: PRD живёт много версий, краткий файл никто не обновляет;
    summary внутри одного файла правится тем же коммитом, что и детали.
  keep_old_caps: >
    Оставить прежние, более тугие лимиты — практика их уже молча нарушала; принуждение к
    обрезке теряет механику бага, ради которой агент читает PRD.
  markdown_instead_of_yaml: >
    Перейти на Markdown — формат остаётся YAML: его читают планировщик-агент и валидатор
    напрямую, без дополнительного парсинга разметки.
  delete_legacy_files: >
    Удалить старые PRD вместо миграции на новый стандарт — отклонено: в них живёт
    невыводимый why-слой фич (отвергнутые альтернативы, инварианты, история граблей), который
    из git history никто не читает; файлы восстановлены и мигрированы.

history:
  v1: принят единый двухслойный стандарт с полным набором секций и валидатором, покрытым тестами
