name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0, defaults to tag without "v")'
        required: false
        type: string
      version_code:
        description: 'Version code integer (defaults to GitHub run_number)'
        required: false
        type: string
      is_draft:
        description: 'Create draft release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run code quality checks
        run: ./gradlew ktlintCheck detekt

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: '**/build/reports/tests/'

  build-and-release:
    name: Build & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version Name and Code
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
          else
            V_NAME="0.1.0"
          fi

          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            V_CODE="${{ github.run_number }}"
          fi

          echo "version_name=${V_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${V_CODE}" >> "$GITHUB_OUTPUT"
          echo "==> Building Release v${V_NAME} (code: ${V_CODE})"

      - name: Setup Release Keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/release.jks"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "==> Production keystore decoded to ${KEYSTORE_FILE}"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not found. Using debug signing fallback."
          fi

      - name: Build Release APK and AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        shell: bash
        run: |
          V_NAME="${{ steps.version.outputs.version_name }}"
          DIST_DIR="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "${DIST_DIR}"

          # Release APK
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ -f "${APK_SRC}" ]; then
            cp "${APK_SRC}" "${DIST_DIR}/proxykillswitcher-v${V_NAME}.apk"
          fi

          # Release App Bundle (AAB)
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "${AAB_SRC}" ]; then
            cp "${AAB_SRC}" "${DIST_DIR}/proxykillswitcher-v${V_NAME}.aab"
          fi

          # ProGuard Mapping
          MAPPING_SRC="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "${MAPPING_SRC}" ]; then
            cp "${MAPPING_SRC}" "${DIST_DIR}/mapping-v${V_NAME}.txt"
          fi

          # Checksums
          cd "${DIST_DIR}"
          sha256sum proxykillswitcher-* > SHA256SUMS.txt

          echo "dist_dir=${DIST_DIR}" >> "$GITHUB_OUTPUT"
          echo "==> Prepared artifacts in ${DIST_DIR}:"
          ls -lh "${DIST_DIR}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.prepare_artifacts.outputs.dist_dir }}/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: Release v${{ steps.version.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ steps.prepare_artifacts.outputs.dist_dir }}/proxykillswitcher-v${{ steps.version.outputs.version_name }}.apk
            ${{ steps.prepare_artifacts.outputs.dist_dir }}/proxykillswitcher-v${{ steps.version.outputs.version_name }}.aab
            ${{ steps.prepare_artifacts.outputs.dist_dir }}/mapping-v${{ steps.version.outputs.version_name }}.txt
            ${{ steps.prepare_artifacts.outputs.dist_dir }}/SHA256SUMS.txt
